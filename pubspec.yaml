name: student_app
description: "Aplicación para estudiantes con gestión de tareas, seguimiento de calificaciones y tutor virtual con IA."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # UI & Design
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  http: ^1.2.0
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/EduBoost.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/EduBoost.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/EduBoost.png"
